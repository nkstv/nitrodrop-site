<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Drop Cash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171209; --bg-soft:#1d1710; --panel:#221a10; --panel-2:#2a2115;
    --line:rgba(232,193,104,.14); --gold:#E8C168; --gold-deep:#C79A3C; --cream:#F4ECD8;
    --muted:rgba(244,236,216,.62);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--cream);
    font-family:"Nunito Sans",system-ui,sans-serif;
    background:radial-gradient(1000px 520px at 50% -10%, rgba(232,193,104,.07), transparent 60%), var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
  }
  .wrap{max-width:460px; width:100%}
  .logo{
    width:74px; height:74px; margin:0 auto 26px; border-radius:20px;
    display:grid; place-items:center;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    font-size:38px;
  }
  .code{
    font-family:"Baloo 2",sans-serif; font-weight:800; line-height:1;
    font-size:96px; margin:0;
    background:linear-gradient(180deg,#F0D08A,var(--gold) 55%,var(--gold-deep));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  h1{
    font-family:"Baloo 2",sans-serif; font-weight:700; font-size:24px;
    margin:14px 0 8px; color:var(--cream);
  }
  p{margin:0 auto 28px; max-width:360px; color:var(--muted); font-size:15px; line-height:1.6}
  .btn{
    display:inline-block; text-decoration:none;
    font-family:"Baloo 2",sans-serif; font-weight:800; font-size:15px;
    color:#3a2a08; padding:14px 30px; border-radius:14px;
    background:linear-gradient(180deg,#F0D08A,var(--gold) 60%,var(--gold-deep));
    box-shadow:0 8px 22px rgba(232,193,104,.22); transition:.15s;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 10px 26px rgba(232,193,104,.32)}
  .foot{margin-top:34px; font-size:12px; letter-spacing:.5px; color:rgba(244,236,216,.4)}
  .foot b{color:var(--gold); font-family:"Baloo 2",sans-serif; letter-spacing:0}
</style>
</head>
<body>
  <main class="wrap">
    <div class="logo">🦁</div>
    <p class="code">404</p>
    <h1>This page doesn't exist</h1>
    <p>The link may be broken, or the page may have moved. Let's get you back on track.</p>
    <a class="btn" href="/">← Back to home</a>
    <div class="foot"><b>DROP CASH</b></div>
  </main>
</body>
</html>
