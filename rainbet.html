<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Username Search</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #7c5cff;
    --text: #e8e8ef;
    --muted: #8a8fa3;
    --border: #262a35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
    min-height: 100vh;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 24px;
  }
  .search-wrap {
    width: 100%;
    max-width: 480px;
    position: relative;
  }
  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  .count {
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 16px 0 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 60vh;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
  }
  li {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
  }
  li:last-child { border-bottom: none; }
  li mark {
    background: var(--accent);
    color: #fff;
    border-radius: 4px;
    padding: 0 2px;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 24px;
    font-size: 14px;
  }
</style>
</head>

const countEl = document.getElementById('count');
const subtitleEl = document.getElementById('subtitle');

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function highlight(name, query) {
  if (!query) return escapeHtml(name);
  const idx = name.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escapeHtml(name);
  const before = escapeHtml(name.slice(0, idx));
  const match = escapeHtml(name.slice(idx, idx + query.length));
  const after = escapeHtml(name.slice(idx + query.length));
  return `${before}<mark>${match}</mark>${after}`;
}

function render(query) {
  const q = query.trim().toLowerCase();
  const filtered = q
    ? users.filter(u => u.toLowerCase().includes(q))
    : users;

  countEl.textContent = filtered.length + " result" + (filtered.length !== 1 ? "s" : "");

  if (filtered.length === 0) {
    resultsEl.innerHTML = '<div class="empty">No username found</div>';
    return;
  }

  resultsEl.innerHTML = filtered
    .map(u => `<li>${highlight(u, query)}</li>`)
    .join('');
}
