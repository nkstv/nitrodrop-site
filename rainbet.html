<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Username Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0a0e17;
    --bg-1: #0f1524;
    --panel: #131a2b;
    --panel-2: #182140;
    --border: #232c45;
    --green: #4fd97f;
    --green-dim: #2f7d52;
    --gold: #f2c14e;
    --text: #eef1fa;
    --muted: #8993ad;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(79,217,127,0.16), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(242,193,78,0.10), transparent 55%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-0));
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 18px 80px;
  }

  h1, h2 { font-family: 'Sora', sans-serif; margin: 0; }

  /* ---------- Header / brand ---------- */
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 34px;
  }
  .coin {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
  }
  .brand-name {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.02em;
    background: linear-gradient(120deg, #ffffff 30%, var(--green) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ---------- Hero / CTA ---------- */
  .hero {
    width: 100%;
    max-width: 560px;
    position: relative;
    background: linear-gradient(155deg, var(--panel-2), var(--panel) 65%);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    text-align: center;
    margin-bottom: 40px;
    overflow: hidden;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  }
  .hero::before {
    content: "";
    position: absolute;
    top: -60%;
    left: 50%;
    width: 420px;
    height: 420px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(79,217,127,0.22), transparent 65%);
    pointer-events: none;
  }
  .hero-eyebrow {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    background: rgba(242,193,78,0.1);
    border: 1px solid rgba(242,193,78,0.3);
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 18px;
  }
  .hero h2 {
    position: relative;
    font-size: 26px;
    line-height: 1.3;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .hero h2 span {
    color: var(--green);
  }
  .hero p {
    position: relative;
    color: var(--muted);
    font-size: 14.5px;
    margin: 0 0 24px 0;
  }
  .hero a.button {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--green), #2fbf67);
    color: #06180d;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 30px;
    border-radius: 12px;
    box-shadow: 0 10px 30px -8px rgba(79,217,127,0.55);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .hero a.button:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 34px -8px rgba(79,217,127,0.7);
  }
  .hero a.button svg { width: 16px; height: 16px; }

  /* ---------- Search section ---------- */
  .search-header {
    width: 100%;
    max-width: 560px;
    margin-bottom: 18px;
  }
  .search-header h1 {
    font-size: 20px;
    font-weight: 700;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13.5px;
    margin-top: 4px;
  }

  .search-wrap {
    width: 100%;
    max-width: 560px;
    position: relative;
  }
  .search-wrap svg.icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--muted);
    pointer-events: none;
  }
  input[type="text"] {
    width: 100%;
    padding: 15px 16px 15px 44px;
    font-size: 15.5px;
    font-family: 'Inter', sans-serif;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="text"]::placeholder { color: #5c6684; }
  input[type="text"]:focus {
    border-color: var(--green-dim);
    box-shadow: 0 0 0 4px rgba(79,217,127,0.12);
  }

  .count {
    margin: 12px 2px 0;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 12px 0 0 0;
    width: 100%;
    max-width: 560px;
    max-height: 56vh;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--panel);
  }
  ul::-webkit-scrollbar { width: 8px; }
  ul::-webkit-scrollbar-track { background: transparent; }
  ul::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  li {
    padding: 13px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 14.5px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  li:last-child { border-bottom: none; }
  li::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green-dim);
    flex-shrink: 0;
  }
  li mark {
    background: rgba(79,217,127,0.25);
    color: var(--green);
    border-radius: 4px;
    padding: 0 3px;
    font-weight: 700;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px 16px;
    font-size: 14px;
  }

  footer {
    margin-top: 36px;
    color: #4a5270;
    font-size: 12px;
    text-align: center;
  }
</style>
</head>

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function highlight(name, query) {
  if (!query) return escapeHtml(name);
  const idx = name.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escapeHtml(name);
  const before = escapeHtml(name.slice(0, idx));
  const match = escapeHtml(name.slice(idx, idx + query.length));
  const after = escapeHtml(name.slice(idx + query.length));
  return `${before}<mark>${match}</mark>${after}`;
}

  const q = query.trim().toLowerCase();

    return;

    .map(u => `<li>${highlight(u, query)}</li>`)
    .join('');
}
